map $http_upgrade $connection_upgrade {
    default   upgrade;
    ''        keep-alive;
}

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Uploads catalogue formation (PDF/vidéo) + imports RH — aligné sur RequestSizeLimit API (500 Mo).
    client_max_body_size 500m;

    # ── HUBS SignalR (WebSocket + LongPolling) ──────────────────────────
    location /hubs/ {
        proxy_pass          http://kyntus_gateway:8080/hubs/;
        proxy_http_version  1.1;

        proxy_set_header    Upgrade          $http_upgrade;
        proxy_set_header    Connection       $connection_upgrade;   # ✅ dynamique
        proxy_set_header    Host             $host;
        proxy_set_header    X-Real-IP        $remote_addr;
        proxy_set_header    X-Forwarded-For  $proxy_add_x_forwarded_for;

        proxy_pass_request_headers  on;
        proxy_read_timeout          3600s;
        proxy_send_timeout          3600s;
        proxy_buffering             off;
        proxy_cache                 off;
    }

    # ── API REST ────────────────────────────────────────────────────────
    location /api/users/import/ {
        proxy_pass          http://kyntus_gateway:8080/api/users/import/;
        proxy_http_version  1.1;
        proxy_set_header    Host             $host;
        proxy_set_header    X-Real-IP        $remote_addr;
        proxy_set_header    X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header    Authorization    $http_authorization;
        proxy_pass_request_headers  on;
        client_max_body_size        500m;
        proxy_read_timeout          600s;
        proxy_connect_timeout       60s;
        proxy_send_timeout          600s;
    }

    # Uploads e-learning (catalogue resources/upload) — gros fichiers.
    location /api/formations/ {
        proxy_pass          http://kyntus_gateway:8080/api/formations/;
        proxy_http_version  1.1;
        proxy_set_header    Host             $host;
        proxy_set_header    X-Real-IP        $remote_addr;
        proxy_set_header    X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header    Authorization    $http_authorization;
        proxy_pass_request_headers  on;
        client_max_body_size        500m;
        proxy_request_buffering     off;
        proxy_read_timeout          600s;
        proxy_connect_timeout       60s;
        proxy_send_timeout          600s;
    }

    location /api/ {
        proxy_pass          http://kyntus_gateway:8080/api/;
        proxy_http_version  1.1;
        proxy_set_header    Host             $host;
        proxy_set_header    X-Real-IP        $remote_addr;
        proxy_set_header    X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header    Authorization    $http_authorization;
        proxy_pass_request_headers  on;
        client_max_body_size        100m;
        proxy_read_timeout          300s;
        proxy_connect_timeout       60s;
        proxy_send_timeout          300s;
    }

    # ── Module Qualité (SPA React iframe) ───────────────────────────────
    location /qualite-app/ {
        proxy_pass          http://kcq-frontend:80/qualite-app/;
        proxy_http_version  1.1;
        proxy_set_header    Host             $host;
        proxy_set_header    X-Real-IP        $remote_addr;
        proxy_set_header    X-Forwarded-For  $proxy_add_x_forwarded_for;
    }

    location /socket.io/ {
        proxy_pass          http://kyntus_gateway:8080/socket.io/;
        proxy_http_version  1.1;
        proxy_set_header    Upgrade          $http_upgrade;
        proxy_set_header    Connection       $connection_upgrade;
        proxy_set_header    Host             $host;
        proxy_set_header    X-Real-IP        $remote_addr;
        proxy_set_header    X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_buffering     off;
    }

    # Profil URLs local/deploy : toujours relire le fichier monté (pas de cache stale)
    location = /kyntus-public-urls.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri =404;
    }

    location = /sw-push.js {
        add_header Cache-Control "no-cache" always;
        add_header Service-Worker-Allowed "/" always;
        try_files $uri =404;
    }

    # ── Angular SPA ─────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Compression ─────────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json
               application/javascript text/xml
               application/xml application/xml+rss text/javascript;
}