# Secrets : copier .env.example vers .env a la racine (jamais committer .env).
# Ports hote Kyntus (evite conflit avec un autre projet Docker sur 4200-5260)
# UI login          8201   | SPA unifiee (planning + prime + parrainage) 8200
# API Gateway       8500   | Postgres hote   8433   | pgAdmin         8505
# auth-backend      8520   | planning        8521   | formation       8522   | documentation 8530
# conge             8540   | prime           8550   | parrainage      8560   | qualite KCQ   8570
# RabbitMQ          8672   | RabbitMQ UI     18672
x-documentation-integration:
  public_gateway_base: "http://10.10.10.25:8500"
  documentation_api_prefixes: "/api/documentation,/api/generate-document-ai"
  documentation_signalr_hub: "/hubs/documentation"

x-kyntus-redis: &kyntus-redis
  ConnectionStrings__Redis: ${KYNTUS_REDIS_CONNECTION:-redis:6379}
  Caching__InstanceName: "kyntus:"

x-kyntus-jwt: &kyntus-jwt
  JwtSettings__Secret: ${KYNTUS_JWT_SECRET:?Définir KYNTUS_JWT_SECRET dans .env}
  JwtSettings__Issuer: ${KYNTUS_JWT_ISSUER:-AuthService}
  JwtSettings__Audience: ${KYNTUS_JWT_AUDIENCE:-AuthServiceClient}

x-kyntus-rabbitmq: &kyntus-rabbitmq
  RabbitMQ__Host: rabbitmq
  RabbitMQ__Username: ${KYNTUS_RABBITMQ_USER:-guest}
  RabbitMQ__Password: ${KYNTUS_RABBITMQ_PASSWORD:?Définir KYNTUS_RABBITMQ_PASSWORD dans .env}

services:

  # DATABASE UNIQUE
  postgres:
    build:
      context: ./init
      dockerfile: postgres/Dockerfile
    image: projets_mykyntus--postgres:16
    container_name: kyntus_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${KYNTUS_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${KYNTUS_POSTGRES_PASSWORD:?Définir KYNTUS_POSTGRES_PASSWORD dans .env}
      KYNTUS_DB_PASSWORD_KYNTUS: ${KYNTUS_DB_PASSWORD_KYNTUS:?Définir KYNTUS_DB_PASSWORD_KYNTUS dans .env}
      KYNTUS_DB_PASSWORD_AUTH: ${KYNTUS_DB_PASSWORD_AUTH:?Définir KYNTUS_DB_PASSWORD_AUTH dans .env}
      KYNTUS_DB_PASSWORD_FORMATION: ${KYNTUS_DB_PASSWORD_FORMATION:?Définir KYNTUS_DB_PASSWORD_FORMATION dans .env}
      KYNTUS_DB_PASSWORD_DOCUMENTATION: ${KYNTUS_DB_PASSWORD_DOCUMENTATION:?Définir KYNTUS_DB_PASSWORD_DOCUMENTATION dans .env}
      KYNTUS_DB_PASSWORD_CONGE: ${KYNTUS_DB_PASSWORD_CONGE:?Définir KYNTUS_DB_PASSWORD_CONGE dans .env}
      KYNTUS_DB_PASSWORD_PRIME: ${KYNTUS_DB_PASSWORD_PRIME:?Définir KYNTUS_DB_PASSWORD_PRIME dans .env}
      KYNTUS_DB_PASSWORD_PARRAINAGE: ${KYNTUS_DB_PASSWORD_PARRAINAGE:?Définir KYNTUS_DB_PASSWORD_PARRAINAGE dans .env}
      KYNTUS_DB_PASSWORD_DIRECTORY: ${KYNTUS_DB_PASSWORD_DIRECTORY:?Définir KYNTUS_DB_PASSWORD_DIRECTORY dans .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Capacite >=300 users : plafond connexions + buffers
    command:
      - postgres
      - -c
      - max_connections=250
      - -c
      - shared_buffers=256MB
    ports:
      - "8433:5432"
    healthcheck:
      # pg_isready alone is true before /docker-entrypoint-initdb.d/init.sql finishes on a fresh volume.
      test:
        - CMD-SHELL
        - >
          pg_isready -U postgres -q &&
          psql -U postgres -tAc "SELECT 1 FROM pg_database WHERE datname='auth_db'" | grep -q 1 &&
          psql -U postgres -tAc "SELECT 1 FROM pg_database WHERE datname='employee_directory_db'" | grep -q 1
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 90s
    networks:
      - microservices-network

  # REDIS (cache L2 partage - capacite >=300 users)
  redis:
    image: redis:7-alpine
    container_name: kyntus_redis
    restart: unless-stopped
    command:
      - redis-server
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - microservices-network

  # BACKENDSâ”€
  auth-backend:
    build:
      context: .
      dockerfile: AuthService/Dockerfile
    container_name: kyntus_auth_backend
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: ${KYNTUS_CONN_AUTH:?Définir KYNTUS_CONN_AUTH dans .env}
      DemoSeed__Enabled: ${KYNTUS_DEMO_SEED_ENABLED:-false}
      DemoSeed__Passwords__Employee: ${KYNTUS_DEMO_SEED_PASSWORD_EMPLOYEE:-Azerty@2026}
      DemoSeed__Passwords__RH: ${KYNTUS_DEMO_SEED_PASSWORD_RH:-Azerty@2026}
      DemoSeed__Passwords__Manager: ${KYNTUS_DEMO_SEED_PASSWORD_MANAGER:-Azerty@2026}
      DemoSeed__Passwords__Coach: ${KYNTUS_DEMO_SEED_PASSWORD_COACH:-Azerty@2026}
      DemoSeed__Passwords__RP: ${KYNTUS_DEMO_SEED_PASSWORD_RP:-Azerty@2026}
      DemoSeed__Passwords__Admin: ${KYNTUS_DEMO_SEED_PASSWORD_ADMIN:-Azerty@2026}
      DemoSeed__Passwords__Audit: ${KYNTUS_DEMO_SEED_PASSWORD_AUDIT:-Azerty@2026}
      DemoSeed__Passwords__Formation: ${KYNTUS_DEMO_SEED_PASSWORD_FORMATION:-Azerty@2026}
      DemoSeed__Passwords__Superviseur: ${KYNTUS_DEMO_SEED_PASSWORD_SUPERVISEUR:-Azerty@2026}
      DemoSeed__Passwords__Qualiticien: ${KYNTUS_DEMO_SEED_PASSWORD_QUALITICIEN:-Azerty@2026}
      KYNTUS_DEMO_ENRICHMENT: ${KYNTUS_DEMO_ENRICHMENT:-false}
      KYNTUS_AUTH_DEMO_AUDIT_SEED: ${KYNTUS_AUTH_DEMO_AUDIT_SEED:-false}
      InternalServices__ApiKey: ${KYNTUS_INTERNAL_SERVICE_API_KEY:?Définir KYNTUS_INTERNAL_SERVICE_API_KEY dans .env}
      Push__VapidPublicKey: ${KYNTUS_VAPID_PUBLIC_KEY:-}
      Push__VapidPrivateKey: ${KYNTUS_VAPID_PRIVATE_KEY:-}
      Push__VapidSubject: ${KYNTUS_VAPID_SUBJECT:-mailto:admin@kyntus.ma}
      <<: [*kyntus-jwt, *kyntus-redis]
    ports:
      - "8520:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 180s
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - microservices-network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: kyntus_rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${KYNTUS_RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${KYNTUS_RABBITMQ_PASSWORD:?Définir KYNTUS_RABBITMQ_PASSWORD dans .env}
      # Ã‰vite les Ã©checs eacces sur .erlang.cookie (souvent vus sous Docker Desktop / WSL2).
      RABBITMQ_ERLANG_COOKIE: ${KYNTUS_RABBITMQ_ERLANG_COOKIE:?Définir KYNTUS_RABBITMQ_ERLANG_COOKIE dans .env}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    entrypoint:
      - /bin/sh
      - -c
      - |
        mkdir -p /var/lib/rabbitmq
        if [ -n "$$RABBITMQ_ERLANG_COOKIE" ]; then
          printf '%s' "$$RABBITMQ_ERLANG_COOKIE" > /var/lib/rabbitmq/.erlang.cookie
          chmod 600 /var/lib/rabbitmq/.erlang.cookie
        fi
        exec docker-entrypoint.sh rabbitmq-server
    ports:
      - "8672:5672"
      - "18672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 90s
    networks:
      - microservices-network
  planning-backend:
    build:
      context: .
      dockerfile: PlanningService/Dockerfile
    container_name: kyntus_planning_backend
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: ${KYNTUS_CONN_PLANNING:?Définir KYNTUS_CONN_PLANNING dans .env}
      Directory__BaseUrl: http://employee-directory-backend:8080/
      Directory__WriteMaster: "true"
      Directory__RequireEnsureOnWrite: "true"
      Directory__EnablePlanningBootstrap: "false"
      Auth__BaseUrl: http://kyntus_auth_backend:8080/
      InternalServices__ApiKey: ${KYNTUS_INTERNAL_SERVICE_API_KEY:?Définir KYNTUS_INTERNAL_SERVICE_API_KEY dans .env}
      Planning__Media__RootPath: /app/uploads/media
      Smtp__Host: ${KYNTUS_SMTP_HOST:-}
      Smtp__Port: ${KYNTUS_SMTP_PORT:-587}
      Smtp__User: ${KYNTUS_SMTP_USER:-}
      Smtp__Password: ${KYNTUS_SMTP_PASSWORD:-}
      Smtp__From: ${KYNTUS_SMTP_FROM:-}
      Smtp__EnableSsl: ${KYNTUS_SMTP_ENABLE_SSL:-true}
      KYNTUS_PLANNING_DEMO_SEED: ${KYNTUS_PLANNING_DEMO_SEED:-false}
      KYNTUS_DEMO_ENRICHMENT: ${KYNTUS_DEMO_ENRICHMENT:-false}
      <<: [*kyntus-jwt, *kyntus-rabbitmq, *kyntus-redis]
    ports:
      - "8521:8080"
    volumes:
      - planning_media_uploads:/app/uploads/media
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      # Migrations + seed seulement avant /health ; marge pour rebuild lent sous Windows.
      retries: 30
      start_period: 300s
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - microservices-network

  formation-backend:
    build:
      context: .
      dockerfile: init/FormationBackend.Dockerfile
    container_name: kyntus_formation_backend
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: ${KYNTUS_CONN_FORMATION:?Définir KYNTUS_CONN_FORMATION dans .env}
      # Catalogue / parcours mock â€” false = data clean (vrais flux mÃ©tier)
      KYNTUS_FORMATION_DEMO_SEED: ${KYNTUS_FORMATION_DEMO_SEED:-false}
      KYNTUS_DEMO_ENRICHMENT: ${KYNTUS_DEMO_ENRICHMENT:-false}
      Formation__UploadRoot: /app/wwwroot/uploads
      <<: [*kyntus-jwt, *kyntus-rabbitmq, *kyntus-redis]
    ports:
      - "8522:8080"
    volumes:
      - formation_uploads:/app/wwwroot/uploads
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - microservices-network

  # Documentation : HTTP interne 8080 ; exposition hôte 5230 = diagnostic uniquement (métier via gateway :5000).
  documentation-backend:
    build:
      context: .
      dockerfile: documentation_service_backend/Dockerfile
    container_name: kyntus_documentation_backend
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      # Crée le schéma documentation + tables au premier démarrage (init.sql ne contient pas le DDL métier).
      Documentation__ApplyBootstrapSchema: "true"
      Documentation__AllowHeaderContextFallback: "false"
      Documentation__DefaultTenantId: "atlas-tech-demo"
      Planning__BaseUrl: http://planning-backend:8080/
      DocumentationDb__Password: ${KYNTUS_DOCUMENTATION_DB_PASSWORD:?Définir KYNTUS_DOCUMENTATION_DB_PASSWORD dans .env}
      ConnectionStrings__Documentation: ${KYNTUS_CONN_DOCUMENTATION:?Définir KYNTUS_CONN_DOCUMENTATION dans .env}
      Documentation__DemoDataSeed: ${KYNTUS_DOCUMENTATION_DEMO_SEED:-false}
      KYNTUS_DEMO_ENRICHMENT: ${KYNTUS_DEMO_ENRICHMENT:-false}
      <<: [*kyntus-jwt, *kyntus-rabbitmq, *kyntus-redis]
    ports:
      - "8530:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - microservices-network

  # â”€â”€â”€ CONGE BACKEND â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  conge-backend:
    build:
      context: .
      dockerfile: FormationService/Conge.API/Dockerfile
    container_name: kyntus_conge_backend
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__CongeDb: ${KYNTUS_CONN_CONGE:?Définir KYNTUS_CONN_CONGE dans .env}
      Directory__BaseUrl: http://employee-directory-backend:8080/
      KYNTUS_CONGE_DEMO_SEED: ${KYNTUS_CONGE_DEMO_SEED:-false}
      KYNTUS_DEMO_ENRICHMENT: ${KYNTUS_DEMO_ENRICHMENT:-false}
      <<: [*kyntus-jwt, *kyntus-rabbitmq, *kyntus-redis]
    ports:
      - "8540:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      employee-directory-backend:
        condition: service_started
    networks:
      - microservices-network

  # One-shot : crÃ©e prime_db + prime_user si le volume Postgres existait avant lâ€™ajout du bloc PRIME dans init.sql.
  prime-db-bootstrap:
    image: postgres:16-alpine
    container_name: kyntus_prime_db_bootstrap
    restart: "no"
    environment:
      PGPASSWORD: ${KYNTUS_POSTGRES_PASSWORD:?Définir KYNTUS_POSTGRES_PASSWORD dans .env}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./init/sql/prime_database.sql:/prime_database.sql:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        until pg_isready -h postgres -p 5432 -U postgres -q; do sleep 2; done
        if psql -h postgres -U postgres -tAc "SELECT 1 FROM pg_database WHERE datname = 'prime_db'" | grep -qx 1; then
          echo "prime_db: already exists"
          exit 0
        fi
        psql -h postgres -U postgres -v ON_ERROR_STOP=1 -f /prime_database.sql
        echo "prime_db: created"
    networks:
      - microservices-network

  prime-backend:
    build:
      context: .
      dockerfile: PrimeBackend/Dockerfile
    container_name: kyntus_prime_backend
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: ${KYNTUS_CONN_PRIME:?Définir KYNTUS_CONN_PRIME dans .env}
      Planning__BaseUrl: http://planning-backend:8080/
      Auth__BaseUrl: http://kyntus_auth_backend:8080/
      InternalServices__ApiKey: ${KYNTUS_INTERNAL_SERVICE_API_KEY:?Définir KYNTUS_INTERNAL_SERVICE_API_KEY dans .env}
      Prime__AutoProvisionEmployeeFromJwt: "true"
      Prime__EnrichDemoData: ${KYNTUS_PRIME_DEMO_SEED:-false}
      KYNTUS_DEMO_ENRICHMENT: ${KYNTUS_DEMO_ENRICHMENT:-false}
      <<: [*kyntus-jwt, *kyntus-rabbitmq, *kyntus-redis]
    ports:
      - "8550:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/api/prime/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 15
      start_period: 180s
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      prime-db-bootstrap:
        condition: service_completed_successfully
    networks:
      - microservices-network

  employee-directory-backend:
    build:
      context: .
      dockerfile: EmployeeDirectory/Dockerfile
    container_name: kyntus_employee_directory_backend
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: ${KYNTUS_CONN_DIRECTORY:?Définir KYNTUS_CONN_DIRECTORY dans .env}
      Prime__BaseUrl: http://prime-backend:8080/
      Planning__BaseUrl: http://planning-backend:8080/
      Htel__BaseUrl: ${HTEL_BASE_URL:-https://htel-groupe.fr/}
      Htel__TechniciensUrl: ${HTEL_TECHNICIENS_URL:-https://htel-groupe.fr/api/v1/techniciens}
      Htel__ApiKey: ${HTEL_API_KEY:-}
      Directory__EnablePrimeBootstrap: "false"
      <<: [*kyntus-jwt, *kyntus-rabbitmq, *kyntus-redis]
    ports:
      - "8565:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/api/directory/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 90s
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - microservices-network

  # One-shot : crée / aligne employee_directory_db + directory_user (volume Postgres ancien).
  employee-directory-db-bootstrap:
    image: postgres:16-alpine
    container_name: kyntus_employee_directory_db_bootstrap
    restart: "no"
    environment:
      PGPASSWORD: ${KYNTUS_POSTGRES_PASSWORD:?Définir KYNTUS_POSTGRES_PASSWORD dans .env}
      KYNTUS_DB_PASSWORD_DIRECTORY: ${KYNTUS_DB_PASSWORD_DIRECTORY:?Définir KYNTUS_DB_PASSWORD_DIRECTORY dans .env}
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        until pg_isready -h postgres -p 5432 -U postgres -q; do sleep 2; done

        # Escape ' pour littéral SQL
        ESC=$$(printf '%s' "$$KYNTUS_DB_PASSWORD_DIRECTORY" | sed "s/'/''/g")

        if psql -h postgres -U postgres -tAc "SELECT 1 FROM pg_roles WHERE rolname = 'directory_user'" | grep -qx 1; then
          psql -h postgres -U postgres -v ON_ERROR_STOP=1 -c "ALTER USER directory_user WITH PASSWORD '$$ESC';"
        else
          psql -h postgres -U postgres -v ON_ERROR_STOP=1 -c "CREATE USER directory_user WITH PASSWORD '$$ESC';"
        fi

        if psql -h postgres -U postgres -tAc "SELECT 1 FROM pg_database WHERE datname = 'employee_directory_db'" | grep -qx 1; then
          echo "employee_directory_db: already exists"
        else
          psql -h postgres -U postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE employee_directory_db OWNER directory_user;"
          echo "employee_directory_db: created"
        fi

        psql -h postgres -U postgres -v ON_ERROR_STOP=1 -c "GRANT ALL PRIVILEGES ON DATABASE employee_directory_db TO directory_user;"
        psql -h postgres -U postgres -d employee_directory_db -v ON_ERROR_STOP=1 -c "GRANT ALL ON SCHEMA public TO directory_user;"
        psql -h postgres -U postgres -d employee_directory_db -v ON_ERROR_STOP=1 -c "GRANT CREATE ON SCHEMA public TO directory_user;"
        echo "employee_directory_db: ready"
    networks:
      - microservices-network

  # One-shot : crÃ©e parrainage_db + parrainage_user si le volume Postgres existait avant lâ€™ajout du bloc PARRAINAGE dans init.sql.
  parrainage-db-bootstrap:
    image: postgres:16-alpine
    container_name: kyntus_parrainage_db_bootstrap
    restart: "no"
    environment:
      PGPASSWORD: ${KYNTUS_POSTGRES_PASSWORD:?Définir KYNTUS_POSTGRES_PASSWORD dans .env}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./init/sql/parrainage_database.sql:/parrainage_database.sql:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        until pg_isready -h postgres -p 5432 -U postgres -q; do sleep 2; done
        if psql -h postgres -U postgres -tAc "SELECT 1 FROM pg_database WHERE datname = 'parrainage_db'" | grep -qx 1; then
          echo "parrainage_db: already exists"
          exit 0
        fi
        psql -h postgres -U postgres -v ON_ERROR_STOP=1 -f /parrainage_database.sql
        echo "parrainage_db: created"
    networks:
      - microservices-network

  parrainage-backend:
    build:
      context: .
      dockerfile: parrainage_service_backend/Dockerfile
    container_name: kyntus_parrainage_backend
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: ${KYNTUS_CONN_PARRAINAGE:?Définir KYNTUS_CONN_PARRAINAGE dans .env}
      # Uploads CV (volume dédié).
      Parrainage__UploadPath: "/app/uploads/cv"
      Planning__BaseUrl: http://planning-backend:8080/
      Parrainage__SeedDemoData: ${KYNTUS_PARRAINAGE_DEMO_SEED:-false}
      KYNTUS_DEMO_ENRICHMENT: ${KYNTUS_DEMO_ENRICHMENT:-false}
      <<: [*kyntus-jwt, *kyntus-rabbitmq, *kyntus-redis]
    volumes:
      - parrainage_cv_uploads:/app/uploads
    ports:
      - "8560:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/api/parrainage/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 15
      start_period: 180s
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      parrainage-db-bootstrap:
        condition: service_completed_successfully
    networks:
      - microservices-network

  # â”€â”€â”€ QUALITÃ‰ KCQ (module wrap Node) â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  kcq-mongo:
    # Default mongo:4.4 for VPS without AVX (web-s-2 exit 132 on mongo:7).
    # Local PC with existing kcq_mongo_data (format 14): use docker-compose.override.yml â†’ mongo:7.
    image: mongo:4.4
    container_name: kyntus_kcq_mongo
    restart: unless-stopped
    volumes:
      - kcq_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongo", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - microservices-network

  # One-shot : restore mongodump KyntusCQ -> kcq si scores/grids vides (./backup_kcq_db).
  kcq-mongo-restore:
    image: mongo:4.4
    container_name: kyntus_kcq_mongo_restore
    restart: "no"
    volumes:
      - ./backup_kcq_db:/backup:ro
      - ./init/kcq-mongo-restore.sh:/restore.sh:ro
    entrypoint: ["/bin/bash", "/restore.sh"]
    depends_on:
      kcq-mongo:
        condition: service_healthy
    networks:
      - microservices-network

  kcq-backend:
    build:
      context: ./QualiteService/backend
      dockerfile: Dockerfile
    container_name: kyntus_kcq_backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://kcq-mongo:27017/kcq
      JWT_SECRET: ${KYNTUS_JWT_SECRET:?Définir KYNTUS_JWT_SECRET dans .env}
      JWT_ISSUER: ${KYNTUS_JWT_ISSUER:-AuthService}
      JWT_AUDIENCE: ${KYNTUS_JWT_AUDIENCE:-AuthServiceClient}
      DIRECTORY_BASE_URL: http://employee-directory-backend:8080
      DIRECTORY_SYNC_INTERVAL_MS: ${DIRECTORY_SYNC_INTERVAL_MS:-600000}
      RECORDINGS_MODE: ${KYNTUS_KCQ_RECORDINGS_MODE:-mysql}
      DB_HOST: ${KYNTUS_KCQ_DB_HOST:-}
      DB_PORT: ${KYNTUS_KCQ_DB_PORT:-3306}
      DB_NAME: ${KYNTUS_KCQ_DB_NAME:-enregistrement_audio}
      DB_USER: ${KYNTUS_KCQ_DB_USER:-kpi}
      DB_PASSWORD: ${KYNTUS_KCQ_DB_PASSWORD:-}
      AUDIO_BASE_PATH: /app/audio_mails
      PICKING_AUDIO_DIR: /app/audio_mails
      PICKING_API_URL: ${KYNTUS_KCQ_PICKING_API_URL:-}
      PICKING_API_KEY: ${KYNTUS_KCQ_PICKING_API_KEY:-}
    volumes:
      - ${KYNTUS_KCQ_AUDIO_HOST_PATH:-./QualiteService/audio_mails}:/app/audio_mails:ro
    ports:
      - "8570:5000"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:5000/api/qualite/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 40s
    depends_on:
      kcq-mongo:
        condition: service_healthy
      kcq-mongo-restore:
        condition: service_completed_successfully
      employee-directory-backend:
        condition: service_started
    networks:
      - microservices-network

  kcq-frontend:
    build:
      context: ./QualiteService/Frontend
      dockerfile: Dockerfile
    container_name: kyntus_kcq_frontend
    restart: unless-stopped
    depends_on:
      - kcq-backend
    networks:
      - microservices-network

  # â”€â”€â”€ API GATEWAY â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  # Point dâ€™entrÃ©e unique cÃ´tÃ© HTTP pour /api/* et /hubs/* (Ocelot : init/ocelot.gateway.json).
  api-gateway:
    build:
      context: ./ApiGateway.API/ApiGateway.API
      dockerfile: Dockerfile
    container_name: kyntus_gateway
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
    ports:
      - "8500:8080"
    volumes:
      - ./init/ocelot.gateway.json:/app/ocelot.json:ro
    depends_on:
      auth-backend:
        condition: service_healthy
      planning-backend:
        condition: service_healthy
      formation-backend:
        condition: service_started
      documentation-backend:
        condition: service_started
      prime-backend:
        condition: service_healthy
      employee-directory-backend:
        condition: service_healthy
      parrainage-backend:
        condition: service_healthy
      kcq-backend:
        condition: service_healthy
    networks:
      - microservices-network

  # â”€â”€â”€ FRONTEND UNIFIÃ‰ â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  # SPA unique (shell + menu global des microservices). auth-frontend = login uniquement.
  auth-frontend:
    build:
      context: ./auth-frontend
      dockerfile: DockerFile
    container_name: kyntus_auth_frontend
    restart: unless-stopped
    ports:
      - "8201:4000"
    environment:
      - API_URL=http://api-gateway:8080
    volumes:
      - ./config/kyntus-public-urls.runtime.js:/app/dist/auth-frontend/browser/kyntus-public-urls.js:ro
    depends_on:
      - api-gateway
    networks:
      - microservices-network

  planning-frontend:
     build:
       context: ./projet_kyntus_service_planning-frontend
       dockerfile: Dockerfile
     container_name: kyntus_planning_frontend
     restart: unless-stopped
     ports:
       - "8200:80"
     volumes:
       - ./config/kyntus-public-urls.runtime.js:/usr/share/nginx/html/kyntus-public-urls.js:ro
     depends_on:
       api-gateway:
         condition: service_started
       planning-backend:
         condition: service_healthy
       kcq-frontend:
         condition: service_started
     networks:
       - microservices-network

  # â”€â”€â”€ PGADMIN â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  pgadmin:
    image: dpage/pgadmin4
    container_name: kyntus_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${KYNTUS_PGADMIN_EMAIL:-admin@kyntus.ma}
      PGADMIN_DEFAULT_PASSWORD: ${KYNTUS_PGADMIN_PASSWORD:?Définir KYNTUS_PGADMIN_PASSWORD dans .env}
    ports:
      - "8505:80"
    networks:
      - microservices-network

volumes:
  postgres_data:
  rabbitmq_data:
  parrainage_cv_uploads:
  formation_uploads:
  planning_media_uploads:
  kcq_mongo_data:
  redis_data:

networks:
  microservices-network:
    driver: bridge
